# Sealed for namespace=monitoring, name=opsagent-secrets. Encrypted to this
# cluster's sealed-secrets controller, so it is useless anywhere else and safe
# to commit.
#
# This is the SAME Gemini key that jsa-prod/jsa-secrets already holds, re-sealed
# for the monitoring namespace (SealedSecrets are namespace-scoped, so the
# jsa-prod one cannot be read from here). Reused rather than minted fresh
# because Gemini quotas are per-model: opsagent runs on gemini-3.6-flash, the
# scorer on gemini-3.1-flash-lite, so they never compete for the same budget.
#
# To rotate: re-seal from the source secret with
#   kubeseal --raw --namespace monitoring --name opsagent-secrets --cert <cert>
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opsagent-secrets
  namespace: monitoring
spec:
  encryptedData:
    gemini-api-key: 
  template:
    metadata:
      name: opsagent-secrets
      namespace: monitoring
    type: Opaque
