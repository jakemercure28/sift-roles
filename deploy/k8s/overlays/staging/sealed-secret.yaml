# jsa-secrets for staging, encrypted with the cluster's sealed-secrets
# public cert (safe to commit; only the in-cluster controller can decrypt).
# Keys: DATABASE_URL, RLS_DATABASE_URL, SUPABASE_ANON_KEY, ENCRYPTION_KEY,
# GEMINI_API_KEY. DSNs use host supabase-db:5432 (the selector-less Service).
# Regenerate after rotating a value on the box:
#   ssh thinkpad 'grep -E "^(DATABASE_URL|RLS_DATABASE_URL|SUPABASE_ANON_KEY|ENCRYPTION_KEY|GEMINI_API_KEY)=" /srv/jsa/staging/.env' \
#     | kubectl create secret generic jsa-secrets -n jsa-staging --dry-run=client -o yaml --from-env-file=/dev/stdin \
#     | kubeseal --kubeconfig ~/.kube/thinkpad.yaml --controller-name sealed-secrets-controller --controller-namespace kube-system -o yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jsa-secrets
  namespace: jsa-staging
spec:
  encryptedData:
    DATABASE_URL: 
    ENCRYPTION_KEY: 
    GEMINI_API_KEY: 
    RLS_DATABASE_URL: 
    SUPABASE_ANON_KEY: 
  template:
    metadata:
      name: jsa-secrets
      namespace: jsa-staging
