apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jsa-staging

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - supabase-db-endpointslice.yaml
  - sealed-secret.yaml

patches:
  - path: configmap-patch.yaml

# Hosted service sunset (2026-08-22): staging follows prod to zero. Set counts
# back to 1 and let Argo sync to bring it back.
replicas:
  - name: go-backend
    count: 0
  - name: scraper-service
    count: 0

# CI rewrites newTag on every dev push (deploy.yml build-push job); Argo CD
# syncs the commit. Do not hand-edit tags outside an incident.
images:
  - name: localhost:5000/jsa/go-backend
    newTag: a4513762f993
  - name: localhost:5000/jsa/scraper-service
    newTag: a4513762f993
