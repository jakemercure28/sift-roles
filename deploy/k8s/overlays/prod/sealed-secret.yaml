# jsa-secrets for PROD, encrypted with the cluster's sealed-secrets public
# cert (safe to commit; only the in-cluster controller can decrypt).
# Keys: DATABASE_URL, RLS_DATABASE_URL, SUPABASE_ANON_KEY, ENCRYPTION_KEY,
# GEMINI_API_KEY, GMAIL_EMAIL, GMAIL_APP_PASSWORD, HUGGINGFACE_API_KEY,
# SAPLING_API_KEY. Prod carries four keys staging does not.
# DSNs use host supabase-db:5432 (the selector-less Service + EndpointSlice),
# rewritten from the box's supabase-db-prod:5432.
# GEMINI_API_KEY_OVERFLOW is deliberately absent: it is commented out in
# /srv/jsa/prod/.env (spend-capped key starved scoring). Do not re-add.
# Regenerate WITHOUT copying prod plaintext off the box (kubeseal to /tmp there,
# then bring back only the sealed output):
#   ssh thinkpad 'grep -E "^(DATABASE_URL|RLS_DATABASE_URL|SUPABASE_ANON_KEY|ENCRYPTION_KEY|GEMINI_API_KEY|GMAIL_EMAIL|GMAIL_APP_PASSWORD|HUGGINGFACE_API_KEY|SAPLING_API_KEY)=" /srv/jsa/prod/.env \
#     | sed "s#@supabase-db-prod:5432#@supabase-db:5432#g" > /tmp/s.env \
#     && sudo k3s kubectl create secret generic jsa-secrets -n jsa-prod --from-env-file=/tmp/s.env --dry-run=client -o yaml \
#     | sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /tmp/kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system; rm -f /tmp/s.env'
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jsa-secrets
  namespace: jsa-prod
spec:
  encryptedData:
    DATABASE_URL: 
    ENCRYPTION_KEY: 
    GEMINI_API_KEY: 
    GMAIL_APP_PASSWORD: 
    GMAIL_EMAIL: 
    HUGGINGFACE_API_KEY: 
    RLS_DATABASE_URL: 
    SAPLING_API_KEY: 
    SUPABASE_ANON_KEY: 
  template:
    metadata:
      name: jsa-secrets
      namespace: jsa-prod
