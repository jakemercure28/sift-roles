# Host supabase-db-prod Postgres, published on the Tailscale IP port 5432
# (Phase 8 pre-flight adds `100.87.101.41:5432:5432` to the supabase-prod
# compose db service).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: supabase-db-1
  labels:
    kubernetes.io/service-name: supabase-db
addressType: IPv4
endpoints:
  - addresses:
      - 100.87.101.41
    conditions:
      ready: true
ports:
  - port: 5432
