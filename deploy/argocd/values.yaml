# Argo CD helm values, single-node trims. Bootstrap (the one thing GitOps
# cannot GitOps, documented in docs/k8s-migration.md):
#
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm install argocd argo/argo-cd -n argocd --create-namespace \
#     -f deploy/argocd/values.yaml --version 10.1.3   # Argo CD v3.4.5
#
# UI access: kubectl port-forward -n argocd svc/argocd-server 8080:80
# over Tailscale from the Mac. Nothing is exposed publicly.

# Single operator, admin user only.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

configs:
  params:
    # TLS terminates at Cloudflare / rides Tailscale; in-cluster plaintext.
    server.insecure: true
  cm:
    # Argo CD 3.x default resource.exclusions minus discovery.k8s.io
    # EndpointSlice: the app overlays carry a MANUAL EndpointSlice pointing
    # the supabase-db Service at host Postgres, and the default exclusion
    # made Argo silently skip applying it (pods then resolve supabase-db to
    # a ClusterIP with no endpoints). Endpoints and the other churn kinds
    # stay excluded; controller-managed slices on this cluster are a
    # handful, so the extra watch load is nil.
    resource.exclusions: |
      - apiGroups:
          - ''
        kinds:
          - Endpoints
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
      - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
        kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
      - apiGroups:
          - certificates.k8s.io
        kinds:
          - CertificateSigningRequest
      - apiGroups:
          - cert-manager.io
        kinds:
          - CertificateRequest
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
      - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
        kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest

controller:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
