# Sealed-secrets controller: encrypted Secrets live in git per overlay,
# the controller decrypts them in-cluster. BACK UP THE PRIVATE KEY (see
# docs/k8s-migration.md, Phase 4): on a single-node cluster a rebuild
# without it means re-sealing everything.
# NOTE: chart repo moved June 2026 (bitnami-labs -> bitnami, Pages URL does
# not redirect).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.1
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
