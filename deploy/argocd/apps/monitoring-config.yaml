# Cluster-side monitoring wiring that is not part of the upstream chart: the
# selector-less Service pointing at the compose Prometheus (remote-write
# target). Split from the `monitoring` Application because that one is a Helm
# source and cannot carry extra manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:jakemercure28/job-search-automation-private.git
    targetRevision: dev
    path: deploy/k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
