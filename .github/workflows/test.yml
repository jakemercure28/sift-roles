name: Test

# pull_request only: there's no branch protection on this repo (private, no
# GitHub Pro), and dev/main only ever advance via squash-merge of an already
# green PR, so a push-triggered re-run here would just re-test identical code
# and burn Actions minutes for nothing.
#
# self-hosted: private repo, so GitHub-hosted minutes are billed. The ThinkPad
# runner that already serves deploy.yml is free. See ci.yml for the trade-off.
#
# paths-ignore: markdown only. `npm run verify` runs `prettier --check .`, and
# *.md is in .prettierignore, so a docs-only change cannot fail this. Do NOT
# extend this to observability/** — that dashboard JSON IS prettier-checked.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, thinkpad]
    timeout-minutes: 10
    env:
      DATA_DIR: data.example

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install scraper-service dependencies
        run: npm ci
        working-directory: scraper-service

      - name: Verify
        run: npm run verify
