apiVersion: 1

# Fixed UIDs so the provisioned dashboards can reference these datasources
# portably (the dashboard JSON points at uid "prometheus" / "loki").
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
